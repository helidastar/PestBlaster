# Copy to training/sources.yaml and describe every folder you put in training/raw/.
#
# Each source folder is a YOLO export (Roboflow "YOLOv8" format, CVAT "YOLO 1.1",
# Label Studio "YOLO"): images plus a .txt label file with the same name, and a
# data.yaml or classes.txt that lists the source's class names.
#
#   map:       source class name -> our class (looper, armyworm_cutworm, aphid_colony)
#              or null to drop boxes of that class. Unlisted classes are dropped too.
#   group:     optional regex. Photos whose names give the same match are kept in the
#              same split (use it for several photos of one plant, so near-copies of a
#              test photo never end up in training).
#   negatives: true for a folder of photos with NO pests (healthy leaves, soil, water
#              drops, holes without a pest). They teach the model when not to spray.

sources:
  # Roboflow Universe leo-bvosh/pest-s0hhq v1 (IP102 photos, 102 classes), YOLOv8 export,
  # unzipped to training/raw/pest-s0hhq/. It has no looper class: get loopers elsewhere.
  pest-s0hhq:
    map:
      army worm: armyworm_cutworm
      cabbage army worm: armyworm_cutworm
      beet army worm: armyworm_cutworm
      prodenia litura: armyworm_cutworm   # = Spodoptera litura
      black cutworm: armyworm_cutworm
      yellow cutworm: armyworm_cutworm
      large cutworm: armyworm_cutworm
      aphids: aphid_colony
      english grain aphid: aphid_colony
      bird cherry-oataphid: aphid_colony
      green bug: aphid_colony             # greenbug, a cereal aphid
      toxoptera aurantii: aphid_colony
      toxoptera citricidus: aphid_colony
      aphis citricola vander goot: aphid_colony

  roboflow-aphids:
    map:
      aphid: aphid_colony
      aphids: aphid_colony

  roboflow-caterpillars:
    map:
      armyworm: armyworm_cutworm
      cutworm: armyworm_cutworm
      spodoptera litura: armyworm_cutworm
      cabbage looper: looper
      looper: looper
      diamondback moth: null   # not one of our pests

  our-garden-2026-10:
    map:
      looper: looper
      armyworm_cutworm: armyworm_cutworm
      aphid_colony: aphid_colony
    group: '^(plant\d+)_'   # plant03_top_01.jpg and plant03_under_02.jpg stay together

  healthy-leaves:
    negatives: true
