# Copy to training/sources.yaml and describe every folder you put in training/raw/.
#
# Each source folder is a YOLO export (Roboflow "YOLOv8" format, CVAT "YOLO 1.1",
# Label Studio "YOLO"): images plus a .txt label file with the same name, and a
# data.yaml or classes.txt that lists the source's class names.
#
#   map:       source class name -> our class (looper, armyworm_cutworm, aphid_colony)
#              or null to drop boxes of that class. Unlisted classes are dropped too.
#   group:     optional regex. Photos whose names give the same match are kept in the
#              same split (use it for several photos of one plant, so near-copies of a
#              test photo never end up in training).
#   negatives: true for a folder of photos with NO pests (healthy leaves, soil, water
#              drops, holes without a pest). They teach the model when not to spray.

sources:
  # Roboflow Universe leo-bvosh/pest-s0hhq v1 (IP102 photos, 96 classes, CC BY 4.0), YOLOv8
  # export, unzipped to training/raw/pest-s0hhq/. It has no looper class: loopers come from
  # the two sources below.
  pest-s0hhq:
    map:
      army worm: armyworm_cutworm
      cabbage army worm: armyworm_cutworm
      beet army worm: armyworm_cutworm
      prodenia litura: armyworm_cutworm   # = Spodoptera litura
      black cutworm: armyworm_cutworm
      yellow cutworm: armyworm_cutworm
      large cutworm: armyworm_cutworm
      aphids: aphid_colony
      english grain aphid: aphid_colony
      bird cherry-oataphid: aphid_colony
      green bug: aphid_colony             # greenbug, a cereal aphid
      toxoptera aurantii: aphid_colony
      toxoptera citricidus: aphid_colony
      aphis citricola vander goot: aphid_colony

  # Roboflow Universe types-of-sports-ball/caterpillar_dataset (CC BY 4.0), YOLOv8 export,
  # unzipped to training/raw/caterpillar-dataset/. Our main looper source; the other six
  # caterpillars (monarch, swallowtail, ...) are not lettuce pests, so their photos are left out.
  caterpillar-dataset:
    map:
      cabage looper: looper     # spelled this way in the dataset
      cabbage looper: looper

  # Roboflow Universe tanmaya/yolo_detection-lafjj (CC BY 4.0, cotton pests), YOLOv8 export,
  # unzipped to training/raw/yolo-detection-lafjj/. Semi-loopers are loopers (same moth
  # subfamily); bollworms are not armyworms, so they are dropped with the other classes.
  yolo-detection-lafjj:
    map:
      semi looper: looper
      aphids: aphid_colony

  # Roboflow Universe puzzle-piece-detection/lettuce-pests (CC BY 4.0), aphids and whiteflies
  # on lettuce, YOLOv8 export, unzipped to training/raw/lettuce-pests/. It boxes every single
  # aphid; prepare_dataset.py joins touching aphids into one colony box (--aphid-gap).
  # Whiteflies are not one of our pests, so they are dropped.
  lettuce-pests:
    map:
      aphid: aphid_colony
      whitefly: null

  # Roboflow Universe uet-taxila-x6wdk/pest-detection-v9gfo (CC BY 4.0), 7,200 field photos,
  # unzipped to training/raw/uet-pest-detection/. Sawflies, beetles, leafhoppers and
  # grasshoppers are not our pests and are dropped.
  uet-pest-detection:
    map:
      aphid: aphid_colony
      armyworm: armyworm_cutworm

  # Roboflow Universe esocfall/tobacco-cutworm (MIT licence), Spodoptera litura larvae,
  # unzipped to training/raw/tobacco-cutworm/.
  tobacco-cutworm:
    map:
      larva: armyworm_cutworm

  # Roboflow Universe detection-xq3mv/pests-ux2g8 (CC BY 4.0), 11 pests, unzipped to
  # training/raw/pests-ux2g8/. Only loopers and armyworms are kept.
  pests-ux2g8:
    map:
      cabbage loopers: looper
      armyworms: armyworm_cutworm
      fall armyworms: armyworm_cutworm

  # Roboflow Universe fall-armyworm/fall-armyworm (CC BY 4.0), maize field photos, unzipped
  # to training/raw/fall-armyworm/. Only the larva boxes are kept; eggs, frass, damage and
  # healthy-maize boxes are dropped (photos with only those are left out).
  fall-armyworm:
    map:
      fall armyworm larva: armyworm_cutworm

  # Roboflow Universe cruciferouscrops/cruciferous-pest (CC BY 4.0), pests on cabbage-family
  # crops, segmentation outlines (prepare_dataset.py turns each outline into its box),
  # unzipped to training/raw/cruciferous-pest/. Adult moths are dropped.
  cruciferous-pest:
    map:
      cabbage looper - larva: looper
      army worm: armyworm_cutworm
      cabbage army worm: armyworm_cutworm
      cutworm: armyworm_cutworm
      tobacco caterpillar: armyworm_cutworm   # = Spodoptera litura larva
      cabbage aphid: aphid_colony
      mustard aphid: aphid_colony

  # iNaturalist photos from fetch_inaturalist.py, after labeling them in Roboflow and
  # exporting as YOLOv8 to training/raw/inaturalist-labeled/. Class names are already ours.
  # The group keeps several photos of one observation in the same split.
  inaturalist-labeled:
    map:
      looper: looper
      armyworm_cutworm: armyworm_cutworm
      aphid_colony: aphid_colony
    group: '^inat_(\d+)_'

  our-garden-2026-10:
    map:
      looper: looper
      armyworm_cutworm: armyworm_cutworm
      aphid_colony: aphid_colony
    group: '^(plant\d+)_'   # plant03_top_01.jpg and plant03_under_02.jpg stay together

  healthy-leaves:
    negatives: true
